[package]
name = "elite-night-light"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", features = ["applet", "tokio", "wayland"] }
zbus = { version = "5.14.0", features = ["blocking"] }
zvariant = "5.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10.2"
log = "0.4.29"
futures-util = "0.3"
tokio = { version = "1.36", features = ["full"] }
once_cell = "1"
tracing = "0.1"
chrono = "0.4.34"
